# Publica el sitio de documentación (docs/, VitePress) en Cloudflare Pages cuando el CI de main termina en verde.
# El sitio es privado: el acceso lo controla Cloudflare Access (Zero Trust) delante del dominio de Pages.
# Requiere en el repo (Settings → Secrets and variables → Actions): los secretos CLOUDFLARE_API_TOKEN (permiso
# «Cloudflare Pages: Edit») y CLOUDFLARE_ACCOUNT_ID. Sin ellos, el job avisa y no falla.
name: Deploy docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Faltan las credenciales de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Sin CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID no se publica la documentación. Ver el encabezado de este archivo."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # «Actualizado» de cada página sale del historial de git
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with: { node-version: 22, cache: pnpm }
      - name: Compilar y publicar
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @backio/docs build
          npx --yes wrangler@4.141.0 pages deploy docs/.vitepress/dist --project-name=backio-docs --branch=main
