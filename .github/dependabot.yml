# Actualizaciones semanales de dependencias (checklist de la auditoría 10/10, punto 20).
# Un solo directorio: es un monorepo pnpm con un lockfile en la raíz que cubre backend, frontend y shared.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
